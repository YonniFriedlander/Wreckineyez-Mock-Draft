                          const r=e.target.value;
                          const pos=tradePick.split(".")[1]||"01";
                          setTradePick(r?`${r}.${pos}`:"");
                        }}
                        style={{width:100}}>
                        <option value="">Round…</option>
                        {Array.from({length:numRounds},(_,i)=>i+1).map(r=>(
                          <option key={r} value={r}>Round {r}</option>
                        ))}
                      </select>
                      <span style={{color:"var(--text3)"}}>.</span>
                      <select value={tradePick.split(".")[1]||""}
                        onChange={e=>{
                          const r=tradePick.split(".")[0]||"";
                          setTradePick(r?`${r}.${e.target.value}`:"");
                        }}
                        style={{width:100}}>
                        <option value="">Pick…</option>
                        {Array.from({length:teams.length},(_,i)=>String(i+1).padStart(2,"0")).map(p=>(
                          <option key={p} value={p}>{p}</option>
                        ))}
                      </select>
                    </div>
                    {(()=>{
                      const parts=tradePick.split(".");
                      if(parts.length!==2||!parts[0]||!parts[1])return null;
                      const r=parseInt(parts[0]),pos=parseInt(parts[1]);
                      // Find the pick with this round + pick-within-round in the effective order
                      const roundPicks=order.filter(p=>p.round===r);
                      // snake: odd rounds forward, even rounds reverse
                      const sorted=r%2===1?[...roundPicks].sort((a,b)=>a.overall-b.overall):[...roundPicks].sort((a,b)=>b.overall-a.overall);
                      const slot=sorted[pos-1];
                      if(!slot)return<span style={{fontSize:11,color:"var(--warn)"}}>Pick not found</span>;
                      if(picks[slot.overall])return<span style={{fontSize:11,color:"var(--warn)"}}>Already used (#{slot.overall})</span>;
                      // Store the overall# internally
                      if(tradePick!==String(slot.overall)){
                        // use effect-like: just record the overall pick number
                        setTimeout(()=>setTradePick(`${r}.${parts[1]}_${slot.overall}`),0);
                      }
                      return<span style={{fontSize:11,color:"var(--text3)"}}>
                        Overall #{slot.overall} · currently owned by {teams[slot.teamIdx]}
                      </span>;
                    })()}
                  </div>
                  <div className="frow">
                    <label>Send to team</label>
                    <select value={tradeTeam} onChange={e=>setTradeTeam(e.target.value)}>
                      <option value="">Select team…</option>
                      {teams.map(t=><option key={t}>{t}</option>)}
                    </select>
                  </div>
                </div>
                <div style={{display:"flex",gap:8,marginTop:20,justifyContent:"flex-end"}}>
                  <button className="ghost" onClick={()=>setTradeModal(false)}>Cancel</button>
                  <button className="primary" onClick={applyMidDraftTrade}
                    disabled={!tradePick||!tradeTeam}>Apply Trade</button>
                </div>
              </div>
            </div>
          )}
            </div>{/* end draft-main */}

            {/* ── Roster sidebar — hidden on board tab ── */}
            {draftTab!=="board"&&(
            <div className="draft-sidebar">
              {/* My team — always at top */}
              <div className="sb-my-team-panel">
                <div className="sidebar-title" style={{color:"var(--mag)",marginBottom:8}}>
                  {myTeam}
                  <span style={{fontWeight:500,color:"var(--text3)",fontSize:9,marginLeft:6,textTransform:"none",letterSpacing:0}}>
                    {myRoster.length}/{numRounds}
                  </span>
                </div>
                {(()=>{
                  // Show slots in order: QB, RB×n, WR×n, TE, FLEX, DST, BN×n
                  const POS_ORDER=[
                    ...Array(rosterSlots.QB||1).fill("QB"),
                    ...Array(rosterSlots.RB||2).fill("RB"),
                    ...Array(rosterSlots.WR||3).fill("WR"),
                    ...Array(rosterSlots.TE||1).fill("TE"),
                    ...Array(rosterSlots.FLEX||1).fill("FLEX"),
                    ...Array(rosterSlots.DST||0).fill("DST"),
                    ...Array(rosterSlots.BN||5).fill("BN"),
                  ];
                  // Assign drafted players to slots greedily (earliest pick first)
                  const sorted=[...myRoster].sort((a,b)=>a.pickNum-b.pickNum);
                  const assigned=[];
                  const counts={QB:0,RB:0,WR:0,TE:0,FLEX:0,DST:0,BN:0};
                  const flexElig=new Set(["RB","WR","TE"]);
                  for(const p of sorted){
                    const pos=p.pos;
                    const slotMax=rosterSlots[pos]||0;
                    if(counts[pos]<slotMax){counts[pos]++;assigned.push({...p,slotLabel:pos});}
                    else if(flexElig.has(pos)&&counts.FLEX<(rosterSlots.FLEX||0)){counts.FLEX++;assigned.push({...p,slotLabel:"FLEX"});}
                    else{counts.BN++;assigned.push({...p,slotLabel:"BN"});}
                  }
                  const posColors={QB:"#FACC15",RB:"var(--teal)",WR:"var(--purp)",TE:"#F472B6",FLEX:"var(--text2)",DST:"#60a5fa",BN:"var(--text3)"};
                  return POS_ORDER.map((slot,i)=>{
                    const player=assigned.find(p=>p.slotLabel===slot&&!POS_ORDER.slice(0,i).some((_,j)=>POS_ORDER[j]===slot&&assigned.filter(p=>p.slotLabel===slot).indexOf(p)<=POS_ORDER.slice(0,j+1).filter(s=>s===slot).length-1));
                    // Simpler: just render slots in order, matching assigned array
                    const slotPlayers=assigned.filter(p=>p.slotLabel===slot);
                    const slotIdx=POS_ORDER.slice(0,i).filter(s=>s===slot).length;
                    const p=slotPlayers[slotIdx];
                    return(
                      <div key={i} className="sb-my-player">
                        <span className={`sb-slot-label${p?" filled":""}`}
                          style={{color:p?posColors[slot]:"var(--border2)"}}>
                          {slot}
                        </span>
                        {p?(
                          <>
                            <span className="sb-player-name" title={p.name}>
                              {lastName(p.name)}
                            </span>
                            <span className="sb-player-round">R{p.round}</span>
                          </>
                        ):(
                          <span style={{fontSize:10,color:"var(--border2)",fontStyle:"italic"}}>empty</span>
                        )}
                      </div>
                    );
                  });
                })()}
              </div>

              {/* All teams summary */}
              <div className="sidebar-title">All Teams</div>
              {teams.map(t=>{
                const r=rosters[t]||[];
                const byPos={QB:0,RB:0,WR:0,TE:0,K:0,DST:0};
                r.forEach(p=>{if(byPos[p.pos]!==undefined)byPos[p.pos]++;});
                const isMe=t===myTeam;
                return(
                  <div key={t} className={`sb-team${isMe?" sb-mine":""}`}>
                    <div className="sb-name">{t}
                      <span className="sb-count">{r.length}</span>
                    </div>
                    <div className="sb-pos-row">
                      {["QB","RB","WR","TE"].map(pos=>byPos[pos]>0&&(
                        <span key={pos} className={`pb ${pos}`}
                          style={{fontSize:9,padding:"1px 5px"}}>
                          {pos}{byPos[pos]>1?<sup style={{fontSize:8}}>{byPos[pos]}</sup>:""}
                        </span>
                      ))}
                      {r.length===0&&<span style={{fontSize:10,color:"var(--text3)"}}>—</span>}
                    </div>
                  </div>
                );
              })}
            </div>
            )}
          </div>{/* end draft-layout */}
        </div>
      )}

      {/* ── Results screen ── */}
      {screen==="results"&&(
        <ResultsPage
          teams={teams} rosters={rosters} myTeam={myTeam}
          picks={picks} order={order} rosterSlots={rosterSlots}
          isFriends={myTeam!=="Yonni"}
          tradedPicks={tradedPicks} players={players}
          onDraftAgain={()=>{
            clearTimeout(simRef.current);
            setPicks({});setCurrentPickIdx(0);setIsSimming(false);
            setLastPick(null);setSelPlayer(null);setSearch("");setFilterPos("ALL");
            setScreen("setup");setSetupTab("board");
          }}
          onExportCSV={exportCSV}
        />
      )}

      {screen==="history"&&<HistoryScreen/>}

      {/* ── Walkthrough ── */}
      {!walkthroughDone&&<Walkthrough
        onDone={(dontShow)=>{
          if(dontShow)localStorage.setItem("wreckineyez-wt","1");
          setWalkthroughDone(true);
        }}
        setSetupTab={setSetupTab}
        screen={screen}
      />}
    </>
  );
}

/* ── Results Page ── */
function ResultsPage({teams,rosters,myTeam,picks,order,onDraftAgain,onExportCSV,rosterSlots,isFriends,tradedPicks,players}){
  const[focus,setFocus]=useState(null);
  const[resultsTab,setResultsTab]=useState("results");
  const canvasRef=useRef(null);
  const[grade]=useState(()=>isFriends?(myTeam==="Aaron"?aaronGrade():fakeGrade()):null);
  const[snarkText]=useState(()=>isFriends?(myTeam==="Aaron"?aaronMessage():snarkMessage()):null);
  const[snarkTitleStr]=useState(()=>isFriends?(myTeam==="Aaron"?aaronTitle():snarkTitle()):null);
  const[standings]=useState(()=>
    projectStandings(teams,rosters,rosterSlots,picks,order,myTeam)
  );
  const[showMethodTip,setShowMethodTip]=useState(false);

  // Assign players to roster slots in draft order, bench = overflow
  function assignSlots(roster){
    // Sort by pick order (earliest first)
    const byPick=[...roster].sort((a,b)=>a.pickNum-b.pickNum);
    const slots=[];
    const counts={QB:0,RB:0,WR:0,TE:0,FLEX:0,DST:0};
    const flexEligible=new Set(["RB","WR","TE"]);
    const benched=[];

    for(const p of byPick){
      const pos=p.pos;
      const slotMax=rosterSlots[pos]||0;
      const flexMax=rosterSlots.FLEX||0;
      if(counts[pos]!==undefined&&counts[pos]<slotMax){
        counts[pos]++;
        slots.push({...p,slotLabel:pos});
      } else if(flexEligible.has(pos)&&counts.FLEX<flexMax){
        counts.FLEX++;
        slots.push({...p,slotLabel:"FLEX"});
      } else {
        benched.push({...p,slotLabel:"BN"});
      }
    }
    // Sort starters by position priority
    const PRI={QB:0,RB:1,WR:2,TE:3,FLEX:4,DST:5};
    slots.sort((a,b)=>(PRI[a.slotLabel]??9)-(PRI[b.slotLabel]??9)||a.pickNum-b.pickNum);
    return{starters:slots,bench:benched};
  }

  function copyRosterImage(teamName){
    const {starters,bench}=assignSlots(rosters[teamName]||[]);
    const allRows=[...starters,{slotLabel:"__divider__"},{...{name:"BENCH",pos:"",slotLabel:"BN",pickNum:999}},...bench.filter((_,i)=>i>0),...(bench.length?[{...bench[0],slotLabel:"BN"}]:[])];
    // Simpler: just render starters then bench
    const rows=[...starters,...bench];
    const W=480,ROW=26,PAD=18,HEADER=56,FOOTER=28,DIVIDER=20;
    const H=HEADER+starters.length*ROW+DIVIDER+bench.length*ROW+PAD+FOOTER;
    const canvas=canvasRef.current;
    canvas.width=W;canvas.height=H;
    const ctx=canvas.getContext("2d");
    ctx.fillStyle="#0B0B14";ctx.fillRect(0,0,W,H);
    const grad=ctx.createLinearGradient(0,0,W,0);
    grad.addColorStop(0,"#8B5CF6");grad.addColorStop(0.5,"#E8366E");grad.addColorStop(1,"#00C8C0");
    ctx.fillStyle=grad;ctx.fillRect(0,0,W,4);
    ctx.fillStyle="#F0EDE8";ctx.font="bold 22px 'Arial Black', sans-serif";
    ctx.textBaseline="top";ctx.fillText(teamName.toUpperCase(),PAD,14);
    ctx.fillStyle="#5A5868";ctx.font="12px Arial, sans-serif";
    ctx.fillText(`${rows.length} players`,PAD,40);
    const posColors={QB:"#FACC15",RB:"#00C8C0",WR:"#A78BFA",TE:"#F472B6",FLEX:"#CBD5E1",BN:"#5A5868"};
    let y=HEADER;
    const drawRow=(p,isBench,rowIdx)=>{
      if(rowIdx%2===0){ctx.fillStyle="rgba(255,255,255,0.025)";ctx.fillRect(0,y-2,W,ROW);}
      const pc=posColors[p.slotLabel]||"#9896A8";
      const slotW=36;
      ctx.fillStyle=pc+"28";ctx.beginPath();ctx.roundRect(PAD,y+1,slotW,ROW-6,3);ctx.fill();
      ctx.fillStyle=isBench?"#5A5868":pc;ctx.font="bold 10px Arial, sans-serif";
      ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.fillText(p.slotLabel,PAD+slotW/2,y+ROW/2);
      ctx.textAlign="left";
      ctx.fillStyle=isBench?"#5A5868":"#F0EDE8";ctx.font="bold 13px Arial, sans-serif";
      ctx.textBaseline="middle";ctx.fillText(p.name,PAD+slotW+8,y+ROW/2);
      ctx.fillStyle="#5A5868";ctx.font="11px Arial, sans-serif";
      ctx.textAlign="right";ctx.fillText(`R${p.round}`,W-PAD,y+ROW/2);
      ctx.textAlign="left";
      y+=ROW;
    };
    starters.forEach((p,i)=>drawRow(p,false,i));
    if(bench.length){
      ctx.fillStyle="#222236";ctx.fillRect(0,y,W,DIVIDER);
      ctx.fillStyle="#5A5868";ctx.font="bold 10px Arial, sans-serif";
      ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.fillText("BENCH",W/2,y+DIVIDER/2);ctx.textAlign="left";
      y+=DIVIDER;
      bench.forEach((p,i)=>drawRow(p,true,i));
    }
    ctx.fillStyle="#5A5868";ctx.font="11px Arial, sans-serif";
    ctx.textBaseline="bottom";ctx.fillText("Wreckineyez Mock Draft",PAD,H-6);
    canvas.toBlob(blob=>{
      if(!blob)return;
      navigator.clipboard.write([new ClipboardItem({"image/png":blob})])
        .then(()=>alert(`${teamName}'s roster copied to clipboard!`))
        .catch(()=>{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`${teamName}-roster.png`;a.click();});
    },"image/png");
  }

  const posShortCounts=(roster)=>{
    const c={QB:0,RB:0,WR:0,TE:0};
    roster.forEach(p=>{if(c[p.pos]!==undefined)c[p.pos]++;});
    return c;
  };

  const POS_ORDER=["QB","RB","WR","TE","K","DST","FLEX"];
  function sortRoster(roster){
    return [...roster].sort((a,b)=>{
      const pi=POS_ORDER.indexOf(a.pos),qi=POS_ORDER.indexOf(b.pos);
      if(pi!==qi)return(pi<0?99:pi)-(qi<0?99:qi);
      return a.pickNum-b.pickNum;
    });
  }

  return(
    <div className="page results-page">
      <canvas ref={canvasRef} id="roster-canvas"/>

      {/* Header */}
      <div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",
        marginBottom:16,flexWrap:"wrap",gap:12}}>
        <div>
          <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:900,fontSize:36,
            textTransform:"uppercase",letterSpacing:"0.04em",lineHeight:1}}>
            <span style={{color:"var(--teal)"}}>🏈</span> Draft Complete
          </div>
          <div style={{fontSize:13,color:"var(--text3)",marginTop:6}}>
            {Object.keys(picks).length} picks · {teams.length} teams
          </div>
        </div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <button onClick={onExportCSV} style={{fontSize:12,padding:"8px 16px"}}>⬇ Export CSV</button>
          <button className="hot" onClick={onDraftAgain} style={{fontSize:13,padding:"9px 20px",fontWeight:800}}>
            Draft Again →
          </button>
        </div>
      </div>

      {/* Tabs */}
      <div className="tabs" style={{marginBottom:20}}>
        {[["results","Results"],["board","Draft Board"]].map(([id,lbl])=>(
          <button key={id} className={`tab${resultsTab===id?" on":""}`}
            onClick={()=>setResultsTab(id)}>{lbl}</button>
        ))}
      </div>

      {/* Draft board tab */}
      {resultsTab==="board"&&(
        <LiveBoard
          order={order} picks={picks} teams={teams}
          myIdx={teams.indexOf(myTeam)} numRounds={order.length/teams.length}
          currentPickIdx={order.length} tradedPicks={tradedPicks}
          players={players} drafted={new Set(Object.values(picks).map(p=>p.name))}
          onEditPick={null}
        />
      )}

      {/* Results tab */}
      {resultsTab==="results"&&isFriends&&grade&&(
        <div style={{background:"var(--s1)",border:`2px solid ${myTeam==="Aaron"?"rgba(245,158,11,0.4)":"var(--mag-border)"}`,
          borderRadius:"var(--rl)",padding:"20px 24px",marginBottom:20,
          display:"flex",alignItems:"center",gap:24,flexWrap:"wrap"}}>
          <div style={{textAlign:"center",minWidth:80}}>
            <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:900,
              fontSize:72,lineHeight:1,color:myTeam==="Aaron"?"var(--gold)":"var(--mag)"}}>{grade}</div>
            <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",
              letterSpacing:"0.08em",color:"var(--text3)"}}>Draft Grade</div>
          </div>
          <div style={{flex:1}}>
            <div style={{fontSize:14,fontWeight:700,color:"var(--text)",marginBottom:6}}>
              {snarkTitleStr}
            </div>
            <div style={{fontSize:12,color:"var(--text3)",lineHeight:1.6,marginBottom:8}}>
              {snarkText}
            </div>
            <div style={{fontSize:11,color:"var(--text3)",fontStyle:"italic",lineHeight:1.5}}>
              Our proprietary draft grading algorithm — trained on thousands of drafts, incapable of
              bias, and completely indifferent to your feelings — has reviewed your selections. This is its verdict.
            </div>
          </div>
        </div>
      )}

      {resultsTab==="results"&&(()=>{
        const {starters,bench}=assignSlots(rosters[myTeam]||[]);
        const hasBreakdown=starters.length>0||bench.length>0;
        const hasStandings=standings&&standings.length>0;
        if(!hasStandings&&!hasBreakdown)return null;

        const POS_COLORS={QB:"#FACC15",RB:"var(--teal)",WR:"var(--purp)",TE:"#F472B6",FLEX:"var(--text2)",DST:"#60a5fa"};

        function PlayerRow({p,isBench}){
          const proj=isBench?null:Math.round(adpExpectedPts(p.pos,p.rank||p.pickNum||100));
          const col=POS_COLORS[p.slotLabel]||"var(--text3)";
          return(
            <div style={{display:"flex",alignItems:"center",gap:8,padding:"4px 8px",
              borderRadius:"var(--r)",background:"var(--s2)",
              borderLeft:`3px solid ${isBench?"var(--border2)":col}`}}>
              <span style={{fontSize:9,fontWeight:800,textTransform:"uppercase",
                letterSpacing:"0.06em",width:30,flexShrink:0,
                color:isBench?"var(--text3)":col}}>{p.slotLabel}</span>
              <span style={{flex:1,fontSize:11,fontWeight:600,color:"var(--text)",
                overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name}</span>
              <span style={{fontSize:10,color:"var(--text3)",flexShrink:0,marginRight:2}}>R{p.round}</span>
              {proj!==null
                ?<span style={{fontSize:11,fontWeight:700,color:col,minWidth:32,textAlign:"right",flexShrink:0}}>{proj}</span>
                :<span style={{fontSize:10,color:"var(--text3)",minWidth:32,textAlign:"right",flexShrink:0}}>—</span>}
            </div>
          );
        }

        const posOrder=["QB","RB","WR","TE","FLEX","DST"];
        const grouped={};
        starters.forEach(p=>{if(!grouped[p.slotLabel])grouped[p.slotLabel]=[];grouped[p.slotLabel].push(p);});
        const totalStarter=starters.reduce((s,p)=>s+adpExpectedPts(p.pos,p.rank||p.pickNum||100),0);

        return(
          <div style={{display:"flex",gap:12,marginBottom:20,alignItems:"stretch",flexWrap:"wrap"}}>

            {/* Left: standings */}
            {hasStandings&&(
              <div style={{flex:"1 1 220px",background:"var(--s1)",border:"1px solid var(--border)",
                borderRadius:"var(--rl)",padding:"16px 18px"}}>
                <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:10}}>
                  <div style={{fontSize:10,fontWeight:800,textTransform:"uppercase",letterSpacing:"0.1em",
                    color:"var(--text3)"}}>Projected Standings</div>
                  <div style={{position:"relative",display:"inline-flex"}}>
                    <span onMouseEnter={()=>setShowMethodTip(true)} onMouseLeave={()=>setShowMethodTip(false)}
                      style={{fontSize:10,color:"var(--text3)",cursor:"default",width:15,height:15,
                        borderRadius:"50%",border:"1px solid var(--border2)",display:"inline-flex",
                        alignItems:"center",justifyContent:"center",fontWeight:700,userSelect:"none"}}>?</span>
                    {showMethodTip&&(
                      <div style={{position:"absolute",bottom:"calc(100% + 6px)",left:"50%",
                        transform:"translateX(-50%)",width:240,background:"var(--s2)",
                        border:"1px solid var(--border2)",borderRadius:"var(--r)",padding:"10px 12px",
                        fontSize:11,color:"var(--text2)",lineHeight:1.6,zIndex:50,
                        boxShadow:"0 8px 24px rgba(0,0,0,0.5)",pointerEvents:"none",whiteSpace:"normal"}}>
                        <strong style={{color:"var(--text)",display:"block",marginBottom:4}}>How projections work</strong>
                        Each team's starters are scored using a fitted ECR→expected points model
                        (exponential decay for RB/WR/TE, linear for QB) calibrated on 154 player-seasons
                        from 2021–2024. Bench excluded. Individual variance is high.
                      </div>
                    )}
                  </div>
                </div>
                <div style={{display:"flex",flexDirection:"column",gap:3}}>
                  {standings.map((row,i)=>(
                    <div key={row.team} style={{display:"flex",alignItems:"center",gap:8,
                      padding:"5px 8px",borderRadius:"var(--r)",
                      background:row.isYonni?"var(--teal-dim)":row.isYou?"var(--mag-dim)":"var(--s2)",
                      border:row.isYonni?"1px solid var(--teal-border)":row.isYou?"1px solid var(--mag-border)":"1px solid transparent"}}>
                      <span style={{fontSize:10,fontWeight:700,color:"var(--text3)",width:18,textAlign:"center",flexShrink:0}}>{i+1}</span>
                      <span style={{flex:1,fontSize:12,fontWeight:row.isYonni||row.isYou?700:400,
                        color:row.isYonni?"var(--teal)":row.isYou?"var(--mag)":"var(--text)",
                        overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                        {row.team}
                        {row.isYonni&&<span style={{fontSize:9,marginLeft:5,color:"var(--teal)"}}>🏆</span>}
                      </span>
                      <span style={{fontSize:11,fontWeight:600,color:"var(--text2)",flexShrink:0,fontVariantNumeric:"tabular-nums"}}>
                        {row.projPts.toLocaleString()}
                      </span>
                    </div>
                  ))}
                </div>
                <div style={{fontSize:10,color:"var(--text3)",marginTop:8,fontStyle:"italic"}}>
                  {isFriends?"* Results may vary. Okay, they definitely will for you.":"* Starter pts · ECR model"}
                </div>
              </div>
            )}

            {/* Right: my team pos breakdown */}
            {hasBreakdown&&(
              <div style={{flex:"1 1 220px",background:"var(--s1)",border:"1px solid var(--mag-border)",
                borderRadius:"var(--rl)",padding:"16px 18px"}}>
                <div style={{display:"flex",alignItems:"baseline",justifyContent:"space-between",marginBottom:10,gap:8}}>
                  <div style={{fontSize:10,fontWeight:800,textTransform:"uppercase",letterSpacing:"0.1em",color:"var(--mag)"}}>
                    {myTeam}
                  </div>
                  <div style={{fontSize:12,fontWeight:700,color:"var(--teal)",flexShrink:0}}>
                    {Math.round(totalStarter).toLocaleString()} pts
                    <span style={{fontSize:10,color:"var(--text3)",fontWeight:400,marginLeft:4}}>starters</span>

// ADP → expected 0 PPR standard points model
// Fitted to 154 player-seasons 2021-2024 (FFC non-PPR 12-team ADP + PFR standard pts)
// QB: linear  pts = 429.3 - 1.82*ecr   (R²=0.71)
// RB: exp     pts = 365.9*e^(-0.00524*ecr) - 65.0  (R²=0.91)
// WR: exp     pts = 259.3*e^(-0.01197*ecr) + 47.7   (R²=0.95)
// TE: exp     pts = 227.2*e^(-0.01455*ecr) + 15.9   (R²=0.98)
function adpExpectedPts(pos, ecr){
  if(!ecr||ecr<=0)return 0;
  switch(pos){
    case"QB": return Math.max(0, 429.323 - 1.8205*ecr);
    case"RB": return Math.max(0, 365.866*Math.exp(-0.005238*ecr) - 65.023);
    case"WR": return Math.max(0, 259.322*Math.exp(-0.011966*ecr) + 47.734);
    case"TE": return Math.max(0, 227.156*Math.exp(-0.014546*ecr) + 15.951);
    default:  return 0;
  }
}

function projectStandings(teams, rosters, rosterSlots, picks, order, myTeam){
  const scored=teams.map(team=>{
    const roster=rosters[team]||[];
    const byPick=[...roster].sort((a,b)=>a.pickNum-b.pickNum);
    const slots=[];
    const counts={QB:0,RB:0,WR:0,TE:0,FLEX:0};
    const flexElig=new Set(["RB","WR","TE"]);
    for(const p of byPick){
      const pos=p.pos;
      const slotMax=rosterSlots[pos]||0;
      if(counts[pos]<slotMax){counts[pos]++;slots.push(p);}
      else if(flexElig.has(pos)&&counts.FLEX<(rosterSlots.FLEX||0)){counts.FLEX++;slots.push(p);}
    }
    const projPts=slots.reduce((sum,p)=>{
      const ecr=p.rank||p.pickNum||100;
      return sum+adpExpectedPts(p.pos,ecr);
    },0);
    return{team,projPts:Math.round(projPts),isYou:team===myTeam,isYonni:team==="Yonni"};
  });
  scored.sort((a,b)=>b.projPts-a.projPts);
  return scored;
}

function Countdown(){
  const[now,setNow]=useState(()=>new Date());
  useEffect(()=>{
    const id=setInterval(()=>setNow(new Date()),1000);
    return()=>clearInterval(id);
  },[]);

  const diff=DRAFT_DATE-now;

  if(diff<=0){
    return(
      <div className="countdown">
        <span className="countdown-live">🏈 Draft Day!</span>
        <span style={{fontSize:13,color:"var(--text2)",marginLeft:4}}>Good luck everyone.</span>
      </div>
    );
  }

  const totalSecs=Math.floor(diff/1000);
  const d=Math.floor(totalSecs/86400);
  const h=Math.floor((totalSecs%86400)/3600);
  const m=Math.floor((totalSecs%3600)/60);
  const s=totalSecs%60;

  const pad=n=>String(n).padStart(2,"0");

  return(
    <div className="countdown">
      <span style={{fontSize:11,color:"var(--text3)"}}>Aug 28 · 7:00 PM EST</span>
      <div style={{display:"flex",alignItems:"center",gap:16,flexWrap:"nowrap"}}>
        <span className="countdown-label">Draft in</span>
        <div className="countdown-units">
          {d>0&&(
            <div className="countdown-unit">
              <span className="countdown-num">{d}</span>
              <span className="countdown-sub">{d===1?"day":"days"}</span>
            </div>
          )}
          <div className="countdown-unit">
            <span className="countdown-num">{pad(h)}</span>
            <span className="countdown-sub">hrs</span>
          </div>
          <div className="countdown-unit">
            <span className="countdown-num">{pad(m)}</span>
            <span className="countdown-sub">min</span>
          </div>
          <div className="countdown-unit">
            <span className="countdown-num">{pad(s)}</span>
            <span className="countdown-sub">sec</span>
          </div>
        </div>
      </div>
    </div>
  );
}

function Walkthrough({onDone,setSetupTab,screen}){
  const[step,setStep]=useState(0);
  const[dontShow,setDontShow]=useState(false);
  const[targetRect,setTargetRect]=useState(null);
  const[arrowReady,setArrowReady]=useState(false);  // only show arrow after box repositions
  const stepRef=useRef(0);
  const boxRef=useRef(null);
  const total=WT_STEPS.length;
  const curr=WT_STEPS[step];

  useEffect(()=>{
    stepRef.current=step;
    if(curr.tab&&screen==="setup"&&setSetupTab)setSetupTab(curr.tab);
    // Clear immediately to prevent flash from previous step's rect
    setTargetRect(null);
    if(curr.target){
      const t=setTimeout(()=>{
        if(stepRef.current!==step)return;
        const el=document.querySelector(`[data-wt="${curr.target}"]`);
        if(el){
          const r=el.getBoundingClientRect();
          setTargetRect({cx:r.left+r.width/2,cy:r.top+r.height/2,
            w:r.width,h:r.height,top:r.top,left:r.left});
        }
      },180);
      return()=>clearTimeout(t);
    }
    // Step 3: scroll the settings detail cards into view
    if(step===3){
      const t2=setTimeout(()=>{
        const cards=document.querySelectorAll(".card");
        if(cards.length>1)cards[1].scrollIntoView({behavior:"smooth",block:"start"});
      },250);
      return()=>clearTimeout(t2);
    }
  },[step]);

  // Arrow only shows after the callout box has moved to its target-based position.
  // targetRect arriving → box moves → one rAF later → read box position → show arrow.
  useEffect(()=>{
    if(!targetRect){setArrowReady(false);return;}
    // Two rAFs: first lets React commit the new box position, second measures it
    let id1=requestAnimationFrame(()=>{
      let id2=requestAnimationFrame(()=>setArrowReady(true));
      return()=>cancelAnimationFrame(id2);
    });
    return()=>cancelAnimationFrame(id1);
  },[targetRect]);

  function renderBody(text,highlights){
    if(!highlights||!highlights.length)return text;
    const escaped=highlights.map(h=>h.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
    const parts=text.split(new RegExp(`(${escaped.join('|')})`));
    return parts.map((p,i)=>
      highlights.includes(p)
        ?React.createElement('strong',{key:i,style:{color:"var(--teal)"}},''+p)
        :p
    );
  }

  function advance(){if(step<total-1)setStep(s=>s+1);else onDone(dontShow);}
  function back(){if(step>0)setStep(s=>s-1);}

  const vw=typeof window!=="undefined"?window.innerWidth:1200;
  const vh=typeof window!=="undefined"?window.innerHeight:800;
  const BOX_W=Math.min(380,vw-32);

  let boxLeft,boxTop;
  if(targetRect){
    boxLeft=Math.max(16,Math.min(targetRect.cx-BOX_W/2,vw-BOX_W-16));
    const spaceBelow=vh-(targetRect.cy+targetRect.h/2);
    boxTop=spaceBelow>240?targetRect.cy+targetRect.h/2+24:targetRect.cy-targetRect.h/2-300;
    boxTop=Math.max(70,Math.min(boxTop,vh-320));
  } else {
    boxLeft=(vw-BOX_W)/2;
    boxTop=Math.max(70,(vh-440)/2);
  }

  // Compute arrow from actual box position (via ref) to target
  const getArrow=()=>{
    if(!targetRect||!arrowReady||!boxRef.current)return null;
    const br=boxRef.current.getBoundingClientRect();
    const x1=br.left+br.width/2;
    const y1=targetRect.cy>br.bottom?br.bottom:br.top;
    const x2=targetRect.cx;
    const y2=targetRect.cy>br.bottom?targetRect.top-10:targetRect.top+targetRect.h+10;
    return{x1,y1,x2,y2};
  };
  const arrow=getArrow();

  return(
    <div style={{position:"fixed",inset:0,zIndex:200,pointerEvents:"none"}}>
      <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,0.62)",pointerEvents:"all"}}
        onClick={()=>onDone(dontShow)}/>

      {targetRect&&(
        <svg style={{position:"fixed",inset:0,width:"100%",height:"100%",
          overflow:"visible",zIndex:201,pointerEvents:"none"}}>
          <defs>
            <marker id="wt-arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
              <path d="M0,0 L0,6 L9,3 z" fill="#00C8C0"/>
            </marker>
          </defs>
          <rect
            x={targetRect.left-8} y={targetRect.top-8}
            width={targetRect.w+16} height={targetRect.h+16}
            rx="8" fill="none" stroke="#00C8C0" strokeWidth="2.5"
            style={{filter:"drop-shadow(0 0 8px rgba(0,200,192,0.8))"}}>
            <animate attributeName="stroke-opacity" values="1;0.4;1" dur="1.4s" repeatCount="indefinite"/>
          </rect>
          {arrow&&(
            <line x1={arrow.x1} y1={arrow.y1} x2={arrow.x2} y2={arrow.y2}
              stroke="#00C8C0" strokeWidth="2.5" strokeDasharray="7,4" opacity="0.9"
              markerEnd="url(#wt-arr)"/>
          )}
        </svg>
      )}

      <div ref={boxRef} style={{
        position:"fixed",left:boxLeft,top:boxTop,width:BOX_W,
        background:"var(--s1)",border:"1px solid var(--border2)",
        borderRadius:"var(--rxl)",padding:"22px 26px",
        boxShadow:"0 24px 80px rgba(0,0,0,0.88),0 0 0 1px rgba(0,200,192,0.12)",
        pointerEvents:"all",zIndex:202,
      }}>
        <div style={{display:"flex",gap:3,marginBottom:14}}>
          {WT_STEPS.map((_,i)=>(
            <div key={i} onClick={()=>setStep(i)} style={{
              height:4,borderRadius:2,cursor:"pointer",transition:"all 0.25s",
              flex:i===step?3:1,
              background:i===step?"var(--teal)":i<step?"var(--teal-border)":"var(--border2)",
            }}/>
          ))}
        </div>

        {curr.tab&&(
          <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.1em",
            color:"var(--teal)",marginBottom:7,display:"flex",alignItems:"center",gap:5}}>
            <span>↑</span> {curr.tab.charAt(0).toUpperCase()+curr.tab.slice(1)} tab — active
          </div>
        )}

        <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:900,fontSize:21,
          textTransform:"uppercase",letterSpacing:"0.04em",color:"var(--text)",marginBottom:9}}>
          {curr.title}
        </div>

        <div style={{fontSize:13,color:"var(--text2)",lineHeight:1.7,
          marginBottom:curr.preview?12:18}}>
          {renderBody(curr.body,curr.hl)}
        </div>

        {curr.preview&&(
          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:16}}>
            {curr.preview.map((pv,i)=>(
              <div key={i} style={{display:"inline-flex",alignItems:"center",gap:6,
                padding:"6px 12px",borderRadius:"var(--r)",
                background:"rgba(0,0,0,0.35)",border:`1px solid ${pv.color}44`}}>
                <span style={{fontSize:16,color:pv.color}}>{pv.icon}</span>
                <span style={{fontSize:12,fontWeight:700,color:pv.color}}>{pv.label}</span>
              </div>
            ))}
            <span style={{fontSize:11,color:"var(--text3)",alignSelf:"center"}}>— appear during the draft</span>
          </div>
        )}

        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <label style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer",
            fontSize:11,color:"var(--text3)",userSelect:"none"}}>
            <input type="checkbox" checked={dontShow} onChange={e=>setDontShow(e.target.checked)}
              style={{cursor:"pointer"}}/>
            Don't show at startup
          </label>
          <div style={{display:"flex",gap:7}}>
            {step>0&&(
              <button className="ghost" onClick={back}
                style={{fontSize:12,padding:"5px 11px"}}>← Back</button>
            )}
            <button className="ghost" onClick={()=>onDone(dontShow)}
              style={{fontSize:11,padding:"5px 10px",color:"var(--text3)"}}>Skip</button>
            {step<total-1?(
              <button className="primary" onClick={advance}
                style={{padding:"6px 16px",fontSize:13,fontWeight:700}}>Next →</button>
            ):(
              <button className="hot" onClick={()=>onDone(dontShow)}
                style={{padding:"6px 16px",fontSize:13,fontWeight:800}}>Let's draft!</button>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── Queue List ── */
function QueueList({queue,setQueue,drafted,canPick,onPick}){
  const dragIdx=useRef(null);
  const[overIdx,setOverIdx]=useState(null);

  function onDragStart(i){dragIdx.current=i}
  function onDragOver(e,i){e.preventDefault();setOverIdx(i)}
  function onDrop(i){
    if(dragIdx.current===null||dragIdx.current===i){setOverIdx(null);return}
    const q=[...queue];const[m]=q.splice(dragIdx.current,1);q.splice(i,0,m);
    setQueue(q);dragIdx.current=null;setOverIdx(null);
  }

  if(!queue.length)return(
    <div style={{padding:"10px 4px",fontSize:12,color:"var(--text3)"}}>
      No players queued. Click a player in the available list then "+ Add selected" above.
    </div>
  );

  const available=queue.filter(n=>!drafted.has(n));
  const taken=queue.filter(n=>drafted.has(n));

  return(
    <div className="queue-list">
      {queue.map((name,i)=>{
        const isDrafted=drafted.has(name);
        const pos=available.indexOf(name)+1;
        return(
          <div key={name}
            className={`q-item${overIdx===i?" ghost-over":""}${isDrafted?" drafted":""}`}
            draggable onDragStart={()=>onDragStart(i)}
            onDragOver={e=>onDragOver(e,i)} onDrop={()=>onDrop(i)}
            onDragEnd={()=>setOverIdx(null)}>
            <span className="q-drag">⠿</span>
            {!isDrafted&&<span className="q-num">{pos}</span>}
            {isDrafted&&<span style={{fontSize:9,color:"var(--text3)",fontWeight:800,
              textTransform:"uppercase",minWidth:16}}>✓</span>}
            <span style={{fontSize:12,fontWeight:isDrafted?500:700,flex:1,
              textDecoration:isDrafted?"line-through":"none",color:isDrafted?"var(--text3)":"var(--text)"}}>
              {name}
            </span>
            {canPick&&!isDrafted&&(
              <button className="primary q-draft-btn" onClick={()=>onPick(name)}>
                Draft
              </button>
            )}
            {isDrafted&&(
              <span style={{fontSize:10,color:"var(--text3)",marginRight:4}}>taken</span>
            )}
            <button className="ghost" style={{padding:"2px 6px",fontSize:14,lineHeight:1,color:"var(--text3)"}}
              onClick={()=>setQueue(q=>q.filter((_,j)=>j!==i))}>×</button>
          </div>
        );
      })}
      {taken.length>0&&(
        <button className="ghost" style={{fontSize:11,marginTop:4,color:"var(--text3)"}}
          onClick={()=>setQueue(q=>q.filter(n=>!drafted.has(n)))}>
          Clear taken ({taken.length})
        </button>
      )}
    </div>
  );
}

/* ── Available panel ── */
function AvailPanel({avail,filterPos,setFilterPos,search,setSearch,selPlayer,setSelPlayer,
                     canPick,curTeam,mode,onPick,survival,lastPick,isSimming,
                     playerNotes,setPlayerNotes,queue,setQueue,
                     picks,teams,order,drafted,rankingMode="ecr"}){

  // Build a lookup: player name → team that drafted them
  const draftedByTeam=useMemo(()=>{
    const map={};
    if(!order||!picks||!teams)return map;
    order.forEach(pick=>{
      if(picks[pick.overall]){
        map[picks[pick.overall].name]=teams[pick.teamIdx];
      }
    });
    return map;
  },[picks,teams,order]);

  // When searching, also show drafted players (but greyed out with team label)
  const displayList=useMemo(()=>{
    if(!search||search.length<2) return avail;
    const q=search.toLowerCase();
    // Players already in avail (undrafted, matching search)
    const undrafted=avail.filter(p=>
      p.name.toLowerCase().includes(q)||p.team.toLowerCase().includes(q)
    );
    // Drafted players matching search
    if(!picks) return undrafted;
    const draftedMatches=Object.values(picks)
      .filter(p=>p.name.toLowerCase().includes(q)||p.team?.toLowerCase().includes(q))
      .map(p=>({...p,isDrafted:true}));
    return [...undrafted,...draftedMatches];
  },[avail,search,picks]);

  const isMobile=useIsMobile();
  const[noteSheetPlayer,setNoteSheetPlayer]=useState(null); // player name being edited in mobile sheet
  const[visiblePick,setVisiblePick]=useState(null);
  const toastRef=useRef(null);

  // Show toast whenever lastPick changes during sim
  useEffect(()=>{
    if(!lastPick)return;
    setVisiblePick(lastPick);
    clearTimeout(toastRef.current);
    // Keep it visible until next pick arrives (cleared by next lastPick update)
    // but always hide after 3s as a safety net
    toastRef.current=setTimeout(()=>setVisiblePick(null),3000);
  },[lastPick]);

  // Hide toast once sim stops
  useEffect(()=>{
    if(!isSimming){
      clearTimeout(toastRef.current);
      setVisiblePick(null);
    }
  },[isSimming]);

  const TIERS=[
    {min:0.85,color:"var(--teal)",  label:"Safe"},
    {min:0.65,color:"#5BC49A",      label:"Likely"},
    {min:0.40,color:"var(--warn)",  label:"Risky"},
    {min:0.18,color:"#D4603A",      label:"Danger"},
    {min:0,   color:"var(--mag)",   label:"Gone"},
  ];
  function tierFor(p){return TIERS.find(t=>p>=t.min)||TIERS[TIERS.length-1];}
  const showSurvival=survival!=null;

  return(
    <div>
      <div style={{display:"flex",gap:10,marginBottom:12,flexWrap:"wrap"}}>
        <input value={search} onChange={e=>setSearch(e.target.value)}
          placeholder="Search player or NFL team…" style={{flex:1,minWidth:160}}/>
        <div className="pills">
          {POSITIONS.map(p=><button key={p} className={`pill${filterPos===p?" on":""}`} onClick={()=>setFilterPos(p)}>{p}</button>)}
        </div>
      </div>

      {/* ── Pick toast ── */}
      <div style={{
        height: visiblePick ? 48 : 0,
        overflow:"hidden",
        transition:"height 0.18s ease",
        marginBottom: visiblePick ? 10 : 0,
      }}>
        {visiblePick&&(()=>{
          const pos=visiblePick.player.pos;
          const t=tierFor(survival?.[visiblePick.player.name]??1);
          return(
            <div style={{
              display:"flex",alignItems:"center",gap:10,
              padding:"9px 14px",
              background:"var(--s2)",
              border:"1px solid var(--border2)",
              borderLeft:`3px solid ${pos==="QB"?"#FACC15":pos==="RB"?"var(--teal)":pos==="WR"?"var(--purp)":pos==="TE"?"#F472B6":"var(--text3)"}`,
              borderRadius:"var(--r)",
              animation:"fadeSlideIn 0.15s ease",
            }}>
              <PB pos={visiblePick.player.pos} posRank={visiblePick.player.posRank}/>
              <span style={{fontWeight:700,fontSize:13}}>{visiblePick.player.name}</span>
              <span style={{color:"var(--text3)",fontSize:12}}>{visiblePick.player.team}</span>
              <span style={{marginLeft:"auto",fontSize:11,color:"var(--text3)",fontWeight:600}}>
                Pick {visiblePick.overall} · {visiblePick.team}
              </span>
            </div>
          );
        })()}
      </div>

      {showSurvival&&(
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10,
          padding:"8px 12px",background:"var(--s2)",borderRadius:"var(--r)",
          border:"1px solid var(--border)"}}>
          <span style={{fontSize:11,fontWeight:700,color:"var(--text3)",textTransform:"uppercase",
            letterSpacing:"0.07em",whiteSpace:"nowrap"}}>Survival to your pick</span>
          <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
            {TIERS.map(t=>(
              <span key={t.label} style={{display:"flex",alignItems:"center",gap:5,fontSize:11}}>
                <span style={{width:9,height:9,borderRadius:2,background:t.color,display:"inline-block",flexShrink:0}}></span>
                <span style={{color:t.color,fontWeight:700}}>{t.label}</span>
              </span>
            ))}
          </div>
        </div>
      )}

      <div style={{fontSize:10,color:"var(--text3)",fontWeight:700,letterSpacing:"0.08em",
        textTransform:"uppercase",marginBottom:8}}>{avail.length} available</div>

      {isMobile?(
        <div className="pcard-list">
          {displayList.slice(0,130).map(p=>{
            const isDrafted=!!p.isDrafted;
            const draftedBy=isDrafted?draftedByTeam[p.name]:null;
            const sel=selPlayer?.name===p.name;
            const sv=survival?.[p.name]??null;
            const pct=sv!=null?Math.round(sv*100):null;
            const tier=sv!=null?tierFor(sv):null;
            const inQueue=queue?.includes(p.name);

            return(
              <div key={p.name} className={`pcard${sel?" sel":""}`}

                {/* Single row: rank · name · pos · team/bye · note · queue · pick */}
                <div style={{display:"flex",alignItems:"center",gap:6}} onClick={e=>e.stopPropagation()}>
                  <span className="pcard-rank" onClick={()=>!isDrafted&&setSelPlayer(sel?null:p)}>
                    #{rankingMode==="sleeper"?(SLEEPER_ADP[p.name]??p.rank):p.rank}
                  </span>
                  <span className="pcard-name" style={{flex:1,cursor:isDrafted?"default":"pointer"}}
                    onClick={()=>!isDrafted&&setSelPlayer(sel?null:p)}>{p.name}</span>
                  <PB pos={p.pos} posRank={p.posRank}/>
                  {isDrafted?(
                    <span style={{fontSize:10,color:"var(--warn)",flexShrink:0,whiteSpace:"nowrap",fontWeight:700}}>
                      {draftedBy}

                    <span style={{fontSize:10,color:"var(--text3)",flexShrink:0,whiteSpace:"nowrap"}}>{p.team}</span>
                  )}
                  {!isDrafted&&<>
                  {/* Note icon button */}
                  <button
                    className={`pcard-note-btn${hasNote?" has-note":""}`}
                    style={{flex:"none",padding:"4px 7px",fontSize:13,minWidth:"auto"}}
                    onClick={()=>setNoteSheetPlayer(p.name)}>
                    {hasNote?"✎":"✎"}
                  </button>
                  {/* Queue star */}
                  <button
                    className={`pcard-queue-btn${inQueue?" in-queue":""}`}
                    style={{padding:"4px 7px",fontSize:14}}
                    onClick={()=>{
                      if(inQueue)setQueue(q=>q.filter(n=>n!==p.name));
                      else setQueue(q=>[...q,p.name]);
                    }}>
                    {inQueue?"★":"☆"}
                  </button>
                  {/* Pick button — only when selected and it's your turn */}
                  {canPick&&sel&&(
                    <button className="primary pcard-pick-btn"
                      onClick={()=>onPick(p)}
                      style={{fontSize:12,padding:"5px 12px",flexShrink:0}}>
                      {mode==="mock"?"Pick ✓":"Draft"}
                    </button>
                  )}
                  </>}
                </div>
                {/* Availability bar — compact, only when survival data exists */}
                {!isDrafted&&showSurvival&&tier!=null&&(
                  <div className="pcard-avail">
                    <div className="pcard-avail-bar">
                      <div style={{height:"100%",width:`${pct}%`,borderRadius:4,
                        background:tier.color,boxShadow:`0 0 4px ${tier.color}55`}}/>
                    </div>
                    <span className="pcard-avail-label" style={{color:tier.color}}>
                      {pct}%
                    </span>
                  </div>
                )}
              </div>
            );
          })}

          {/* Mobile note editor — bottom sheet */}
          {noteSheetPlayer&&(
            <div className="note-sheet-overlay" onClick={()=>setNoteSheetPlayer(null)}>
              <div className="note-sheet" onClick={e=>e.stopPropagation()}>
                <div style={{fontSize:13,fontWeight:700,marginBottom:10,color:"var(--text)"}}>
                  Note — {noteSheetPlayer}
                </div>
                <textarea
                  autoFocus
                  value={playerNotes?.[noteSheetPlayer]||""}
                  placeholder="Scouting notes, injury concerns, handcuff info…"
                  onChange={e=>setPlayerNotes(n=>({...n,[noteSheetPlayer]:e.target.value}))}
                />
                <div style={{display:"flex",justifyContent:"flex-end",marginTop:12}}>
                  <button className="primary" onClick={()=>setNoteSheetPlayer(null)}
                    style={{padding:"9px 22px",fontSize:13}}>Done</button>
                </div>
              </div>
            </div>
          )}
        </div>
      ):(
      <div className="ptable-wrap">
        <table className="ptable" style={{tableLayout:"fixed"}}>
          <colgroup>
            <col style={{width:42}}/>  {/* Rank */}
            <col/>                     {/* Player — takes remaining space */}
            <col style={{width:54}}/>  {/* Pos */}
            <col style={{width:46}}/>  {/* NFL */}
            <col style={{width:36}}/>  {/* Bye */}
            {showSurvival&&<col style={{width:155}}/>}
            <col style={{width:150}}/> {/* Notes */}
            <col style={{width:40}}/> {/* Queue */}
            <col style={{width:80}}/> {/* Pick — always present */}
          </colgroup>
          <thead>
            <tr>
              <th>Rank</th>
              <th>Player</th>
              <th>Pos</th>
              <th>NFL</th>
              <th>Bye</th>
              {showSurvival&&<th>Availability</th>}
              <th>Notes</th>
              <th title="Add to queue">Q</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            {displayList.slice(0,130).map(p=>{
              const isDrafted=!!p.isDrafted;
              const draftedBy=isDrafted?draftedByTeam[p.name]:null;
              const sel=selPlayer?.name===p.name;
              const sv=survival?.[p.name]??null;
              const pct=sv!=null?Math.round(sv*100):null;

                  <td style={{color:"var(--text3)",fontSize:12,fontWeight:600}}>{p.rank}</td>
                  <td style={{fontWeight:sel?700:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name}</td>

                  {showSurvival&&(
                    <td style={{padding:"6px 10px"}}>
                      {!isDrafted&&tier!=null?(
                        <div style={{display:"flex",alignItems:"center",gap:7}}>
                          <div style={{flex:1,height:6,background:"var(--s3)",borderRadius:3,overflow:"hidden"}}>
                            <div style={{
                              height:"100%",width:`${pct}%`,borderRadius:3,
                              background:tier.color,
                              transition:"width 0.3s",

                            }}/>
                          </div>
                          <span style={{
                            fontSize:10,fontWeight:800,color:tier.color,
                            minWidth:58,textAlign:"right",letterSpacing:"0.03em",

                  <td className="note-cell" onClick={e=>e.stopPropagation()}>
                    <div style={{position:"relative"}}>
                      <input className="note-input"
                        value={playerNotes?.[p.name]||""}
                        placeholder="note…"
                        title={playerNotes?.[p.name]||""}
                        onChange={e=>setPlayerNotes(n=>({...n,[p.name]:e.target.value}))}

                          // Swap to textarea on focus for multi-line editing

                          const ta=e.target.nextSibling;

                      <textarea

                          fontSize:11,padding:"6px 8px",borderRadius:6,
                          background:"var(--s1)",border:"1px solid var(--purp)",
                          color:"var(--text)",resize:"vertical",fontFamily:"inherit",
                          boxShadow:"0 8px 24px rgba(0,0,0,0.5)"}}
                        value={playerNotes?.[p.name]||""}
                        placeholder="note…"
                        onChange={e=>setPlayerNotes(n=>({...n,[p.name]:e.target.value}))}
                        onBlur={e=>{
                          e.target.style.display="none";
                          e.target.previousSibling.style.display="";
                        }}
                      />
                    </div>
                  </td>
                  <td style={{textAlign:"center",padding:"4px 4px"}} onClick={e=>e.stopPropagation()}>
                    <button
                      title={inQueue?"Remove from queue":"Add to queue"}
                      className="ghost"
                      style={{
                        fontSize:14,padding:"2px 5px",lineHeight:1,
                        color:inQueue?"var(--teal)":"var(--text3)",
                        background:inQueue?"var(--teal-dim)":"transparent",
                      }}
                      onClick={()=>{
                        if(inQueue)setQueue(q=>q.filter(n=>n!==p.name));
                        else setQueue(q=>[...q,p.name]);
                      }}>
                      {inQueue?"★":"☆"}
                    </button>
                  </td>
                  {canPick&&(
                    <td style={{textAlign:"right",padding:"4px 8px"}}>
                      {sel&&<button className="primary" onClick={e=>{e.stopPropagation();onPick(p)}}
                        style={{fontSize:12,padding:"5px 12px"}}>
                        {mode==="mock"?"Pick ✓":"Draft"}
                      </button>}
                    </td>
                  )}
                  {!canPick&&<td/>}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      )}
    </div>
  );
}

/* ── Live draft board ── */
function LiveBoard({order,picks,teams,myIdx,numRounds,currentPickIdx,tradedPicks,players,drafted,onEditPick}){
  const rounds=Array.from({length:numRounds},(_,i)=>i+1);
  const[editModal,setEditModal]=useState(null); // {overall, currentPlayer}
  const[editSearch,setEditSearch]=useState("");

  const tradeMap={};
  if(tradedPicks) tradedPicks.forEach(t=>tradeMap[t.fromPick]=true);

  const n=teams.length;
  function origTeamIdx(overall){
    const round=Math.ceil(overall/n);
    const posInRound=((overall-1)%n)+1;
    const slotInRound=round%2===1?posInRound:n-posInRound+1;
    return slotInRound-1;
  }

  function openEdit(pick){
    setEditSearch("");
    setEditModal({overall:pick.overall,current:picks[pick.overall]||null});
  }

  const editResults=useMemo(()=>{
    if(!editSearch.trim()||!players)return[];
    const q=editSearch.toLowerCase();
    return players.filter(p=>p.name.toLowerCase().includes(q)||p.team.toLowerCase().includes(q)).slice(0,8);
  },[editSearch,players]);

  return(
    <div className="board-wrap">
      <table className="btable">
        <thead>
          <tr>
            <th className="rh" style={{background:"var(--bg)"}}></th>
            {teams.map((t,i)=><th key={i} className={i===myIdx?"mine-h":""}><span className="bth-inner">{t}</span></th>)}
          </tr>
        </thead>
        <tbody>
          {rounds.map(r=>{
            // Always show picks in original owner's column
            const byOriginal={};
            order.filter(p=>p.round===r).forEach(p=>{
              const oi=origTeamIdx(p.overall);
              if(!byOriginal[oi])byOriginal[oi]=[];
              byOriginal[oi].push(p);
            });

            return(
              <tr key={r}>
                <td className="rh">{r}</td>
                {teams.map((_,i)=>{
                  const allPicks=byOriginal[i]||[];
                  if(!allPicks.length)return<td key={i} className={i===myIdx?"mine-col":""}/>;
                  const isCurCell=allPicks.some(p=>order.findIndex(o=>o.overall===p.overall)===currentPickIdx);
                  return(
                    <td key={i}
                      className={`${i===myIdx?"mine-col":""}${isCurCell?" cur":""}`}
                      title="Click to edit"
                      style={{cursor:"pointer"}}
                      onClick={()=>openEdit(allPicks[0])}>
                      {allPicks.map(pick=>{
                        const player=picks[pick.overall];
                        const isTrade=tradedPicks&&tradedPicks.some(t=>t.fromPick===pick.overall);
                        const trade=tradedPicks&&tradedPicks.find(t=>t.fromPick===pick.overall);
                        const newOwner=trade?trade.toTeam:"";
                        return(
                          <div key={pick.overall} className="bcell">
                            {player?(
                              <>
                                <div style={{display:"flex",alignItems:"center",gap:2,justifyContent:"center"}}>
                                  <PB pos={player.pos} posRank={player.posRank||player.pos} style={{fontSize:8,padding:"0 3px"}}/>
                                </div>
                                <span className="bn">{lastName(player.name)}</span>
                                {isTrade&&<span className="bm" style={{color:"var(--warn)",fontSize:7}}>to {newOwner.slice(0,5).toUpperCase()}</span>}
                              </>
                            ):(
                              isTrade?(
                                <>
                                  <span className="bm" style={{color:"var(--warn)"}}>→</span>
                                  <span className="bn" style={{color:"var(--warn)"}}>{newOwner.slice(0,6)}</span>
                                </>
                              ):(
                                <span className="bnum">#{pick.overall}</span>
                              )
                            )}
                          </div>
                        );
                      })}
                    </td>
                  );
                })}
              </tr>
            );
          })}
        </tbody>
      </table>

      {/* Edit pick modal */}
      {editModal&&(
        <div className="overlay" onClick={()=>setEditModal(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="modal-title">Edit Pick #{editModal.overall}</div>
            <div className="modal-sub">
              {editModal.current
                ?<>Currently: <strong>{editModal.current.name}</strong> — search to replace, or clear</>
                :"No pick yet — search to force assign"}
            </div>
            <div style={{position:"relative",marginBottom:12}}>
              <input autoFocus value={editSearch} onChange={e=>setEditSearch(e.target.value)}
                placeholder="Search player…" style={{width:"100%"}}/>
              {editResults.length>0&&(
                <div className="ac-list">
                  {editResults.map(p=>(
                    <div key={p.name} className="ac-item" onClick={()=>{
                      onEditPick(editModal.overall,p);
                      setEditModal(null);
                    }}>
                      <PB pos={p.pos} posRank={p.pos}/>
                      <span style={{fontWeight:600}}>{p.name}</span>
                      <span style={{fontSize:11,color:"var(--text3)",marginLeft:"auto"}}>{p.team} · #{p.rank}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
            <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:16}}>
              {editModal.current&&(
                <button className="danger-ghost" onClick={()=>{
                  onEditPick(editModal.overall,null);
                  setEditModal(null);
                }}>Clear pick</button>
              )}
              <button className="ghost" onClick={()=>setEditModal(null)}>Cancel</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ── Rosters ── */
function RostersTab({teams,rosters,myTeam}){
  const POS_ORDER=["QB","RB","RB","WR","WR","WR","TE","FLEX","DST","BN","BN","BN","BN","BN"];
  const POS_LABELS=["QB","RB1","RB2","WR1","WR2","WR3","TE","FLEX","DST","BN1","BN2","BN3","BN4","BN5"];

  // Build grid: for each team, slot players into position rows
  function buildSlots(team){
    const roster=[...(rosters[team]||[])].sort((a,b)=>a.pickNum-b.pickNum);
    const counts={QB:0,RB:0,WR:0,TE:0,DST:0,K:0};
    const slots=Array(POS_LABELS.length).fill(null);
    const bench=[];
    // Fill starters first
    for(const p of roster){
      const pos=p.pos;
      if(pos==="QB"&&counts.QB<1){slots[0]=p;counts.QB++;}
      else if(pos==="RB"&&counts.RB<2){slots[1+counts.RB]=p;counts.RB++;}
      else if(pos==="WR"&&counts.WR<3){slots[3+counts.WR]=p;counts.WR++;}
      else if(pos==="TE"&&counts.TE<1){slots[6]=p;counts.TE++;}
      else if(pos==="DST"&&counts.DST<1){slots[8]=p;counts.DST++;}
      else bench.push(p);
    }
    // Fill FLEX with best remaining RB/WR/TE
    if(!slots[7]){
      const flexIdx=bench.findIndex(p=>["RB","WR","TE"].includes(p.pos));
      if(flexIdx>=0){slots[7]=bench.splice(flexIdx,1)[0];}
    }
    // Fill bench slots
    bench.forEach((p,i)=>{if(i<5)slots[9+i]=p;});
    return slots;
  }

  const teamSlots={};
  teams.forEach(t=>{teamSlots[t]=buildSlots(t);});

  const posColors={QB:"var(--pos-qb,#a78bfa)",RB:"var(--pos-rb,#34d399)",
    WR:"var(--pos-wr,#60a5fa)",TE:"var(--pos-te,#f59e0b)",
    DST:"var(--pos-dst,#94a3b8)",K:"var(--pos-k,#94a3b8)"};

  // Abbreviate long names
  function abbrev(name){
    if(!name) return "";
    const suffixes=new Set(["jr.","jr","sr.","sr","ii","iii","iv"]);
    const parts=name.trim().split(" ");
    const filtered=parts.filter(p=>!suffixes.has(p.toLowerCase()));
    if(filtered.length<2) return name;
    const last=filtered[filtered.length-1];
    return last.length<=11 ? last : last.slice(0,10)+"…";
  }

  return(
    <div style={{overflowX:"auto",WebkitOverflowScrolling:"touch"}}>
      <table style={{borderCollapse:"collapse",fontSize:11,width:"100%",minWidth:900}}>
        <thead>
          <tr>
            <th style={{position:"sticky",left:0,background:"var(--bg)",zIndex:2,
              padding:"6px 8px",textAlign:"left",fontSize:10,fontWeight:800,
              textTransform:"uppercase",letterSpacing:"0.07em",color:"var(--text3)",
              borderBottom:"2px solid var(--border2)",minWidth:48}}>
              Slot
            </th>
            {teams.map(t=>(
              <th key={t} style={{padding:"6px 6px",textAlign:"center",fontSize:10,fontWeight:800,
                textTransform:"uppercase",letterSpacing:"0.06em",
                color:t===myTeam?"var(--teal)":"var(--text3)",
                borderBottom:"2px solid var(--border2)",minWidth:72,
                borderLeft:"1px solid var(--border)"}}>
                {t}
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {POS_LABELS.map((label,rowIdx)=>{
            const isBench=label.startsWith("BN");
            const posCat=POS_ORDER[rowIdx];
            const posColor=posColors[posCat]||"var(--text3)";
            return(
              <tr key={label} style={{background:isBench?"rgba(0,0,0,0.15)":"transparent"}}>
                <td style={{position:"sticky",left:0,background:isBench?"var(--s1)":"var(--bg)",
                  zIndex:1,padding:"5px 8px",fontWeight:700,fontSize:10,
                  textTransform:"uppercase",letterSpacing:"0.06em",
                  color:isBench?"var(--text3)":posColor,
                  borderBottom:"1px solid var(--border)",whiteSpace:"nowrap"}}>
                  {label}
                </td>
                {teams.map(t=>{
                  const player=teamSlots[t][rowIdx];
                  const isMyTeam=t===myTeam;
                  return(
                    <td key={t} style={{padding:"4px 6px",textAlign:"center",
                      borderBottom:"1px solid var(--border)",
                      borderLeft:"1px solid var(--border)",
                      background:isMyTeam?"rgba(45,212,191,0.04)":"transparent"}}>
                      {player?(
                        <span style={{fontWeight:isMyTeam?700:500,
                          color:isMyTeam?"var(--teal)":"var(--text2)",
                          fontSize:11,whiteSpace:"nowrap"}}>
                          {abbrev(player.name)}
                        </span>
                      ):(
                        <span style={{color:"var(--border2)",fontSize:10}}>—</span>
                      )}
                    </td>
                  );
                })}
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

function RosterView({roster,showCounts}){
  const sorted=[...roster].sort((a,b)=>a.pickNum-b.pickNum);
  const byPos={};roster.forEach(p=>{if(!byPos[p.pos])byPos[p.pos]=[];byPos[p.pos].push(p)});
  return(
    <div>
      {showCounts&&(
        <div className="rcounts">
          {["QB","RB","WR","TE","K","DST"].filter(p=>byPos[p]?.length).map(p=>(
            <span key={p} className={`pb ${p}`} style={{padding:"5px 14px",fontSize:12,fontWeight:800}}>
              {p} ×{byPos[p].length}
            </span>
          ))}
          {!roster.length&&<span style={{color:"var(--text3)",fontSize:13}}>No picks yet</span>}
        </div>
      )}
      {sorted.length>0&&(
        <div className="ptable-wrap">
          <table className="ptable">
            <thead>
              <tr>
                <th style={{width:36}}>Rd</th><th style={{width:44}}>#</th>
                <th>Player</th><th style={{width:64}}>Pos</th>
                <th style={{width:50}}>NFL</th><th style={{width:40}}>Bye</th>
              </tr>
            </thead>
            <tbody>
              {sorted.map(p=>(
                <tr key={p.pickNum}>
                  <td style={{color:"var(--text3)",fontWeight:600}}>{p.round}</td>
                  <td style={{color:"var(--text3)",fontWeight:600}}>{p.pickNum}</td>
                  <td style={{fontWeight:600}}>{p.name}</td>
                  <td><PB pos={p.pos} posRank={p.posRank}/></td>
                  <td style={{color:"var(--text2)",fontSize:12,fontWeight:500}}>{p.team}</td>
                  <td style={{color:"var(--text3)",fontSize:12}}>{p.bye}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
      {!sorted.length&&!showCounts&&<p style={{color:"var(--text3)",padding:"12px 0",fontSize:13}}>No picks yet.</p>}
    </div>
  );
}
