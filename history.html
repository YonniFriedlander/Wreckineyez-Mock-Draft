<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--s1:#1a1f2e;--s2:#1e2535;--s3:#252d40;
  --border:#2d3748;--border2:#374151;
  --text:#f1f5f9;--text2:#94a3b8;--text3:#64748b;
  --teal:#2dd4bf;--teal-dim:rgba(45,212,191,0.08);--teal-border:rgba(45,212,191,0.25);
  --mag:#e8366e;--gold:#f59e0b;--gold-dim:rgba(245,158,11,0.12);
  --purp:#a78bfa;--r:6px;--rl:10px;
}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;padding:0 0 80px}

/* Header */
.site-header{
  background:var(--s1);border-bottom:1px solid var(--border);
  padding:16px 24px;display:flex;align-items:center;gap:12px;
  position:sticky;top:0;z-index:100;
}

.container{max-width:1000px;margin:0 auto;padding:0 20px}

/* Section */
.section-label{
  font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:900;
  text-transform:uppercase;letter-spacing:0.06em;color:var(--text);
  margin:48px 0 4px;
}
.section-sub{font-size:11px;color:var(--text3);margin-bottom:18px;letter-spacing:0.02em;}

/* Championship Wall */
.champ-wall{
  background:linear-gradient(135deg,var(--s1) 0%,rgba(245,158,11,0.06) 100%);
  border:1px solid rgba(245,158,11,0.2);border-radius:var(--rl);
  padding:22px;margin-top:28px;
}
.champ-wall-title{font-size:10px;font-weight:800;text-transform:uppercase;
  letter-spacing:0.1em;color:var(--gold);margin-bottom:14px;}
.champ-grid{display:flex;flex-wrap:wrap;gap:8px;}
.champ-card{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  background:var(--gold-dim);border:1px solid rgba(245,158,11,0.15);
  border-radius:var(--r);padding:9px 13px;min-width:68px;
  cursor:pointer;transition:all 0.15s;position:relative;
}
.champ-card:hover{background:rgba(245,158,11,0.22);border-color:rgba(245,158,11,0.4);transform:translateY(-1px);}
.champ-card.active-card{background:rgba(245,158,11,0.25);border-color:rgba(245,158,11,0.6);
  box-shadow:0 0 0 2px rgba(245,158,11,0.3);}
.champ-year{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:0.04em;}
.champ-trophy{font-size:18px;line-height:1.2;}
.champ-name{font-size:11px;font-weight:800;text-align:center;}

/* Season detail modal */
.season-detail{
  background:var(--s1);border:1px solid var(--border2);border-radius:var(--rl);
  padding:20px;margin-top:12px;
  animation:fadeIn 0.18s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.season-detail-header{
  display:flex;align-items:center;gap:10px;margin-bottom:16px;
  padding-bottom:12px;border-bottom:1px solid var(--border);
}
.season-detail-year{font-family:'Barlow Condensed',sans-serif;font-size:32px;
  font-weight:900;color:var(--gold);}
.season-detail-champ{font-size:13px;font-weight:700;}
.season-detail-champ span{font-size:18px;margin-right:4px;}
.season-close{margin-left:auto;background:none;border:1px solid var(--border2);
  border-radius:var(--r);color:var(--text3);padding:4px 10px;cursor:pointer;font-size:12px;}
.season-close:hover{background:var(--s3);color:var(--text);}

.season-table{width:100%;border-collapse:collapse;font-size:12px;}
.season-table th{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:0.07em;
  color:var(--text3);padding:6px 8px;text-align:left;border-bottom:1px solid var(--border2);}
.season-table td{padding:6px 8px;border-bottom:1px solid var(--border);}
.season-table tr:last-child td{border-bottom:none;}
.season-table tr:hover td{background:var(--s2);}
.pos-badge{display:inline-flex;align-items:center;justify-content:center;
  width:20px;height:20px;border-radius:50%;font-size:10px;font-weight:800;
  background:var(--s3);color:var(--text3);}
.po-badge{font-size:9px;font-weight:700;padding:2px 5px;border-radius:3px;margin-left:4px;}
.po-1{background:rgba(245,158,11,0.15);color:var(--gold);}
.po-2{background:rgba(100,116,139,0.12);color:var(--text3);}
.po-3{background:rgba(100,116,139,0.12);color:var(--text3);}
.po-4{background:rgba(100,116,139,0.12);color:var(--text3);}

/* Leaderboards */
.lb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
.lb-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--rl);padding:16px;}
.lb-title{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.08em;
  color:var(--text3);margin-bottom:10px;}
.lb-row{display:flex;align-items:center;gap:8px;padding:5px 0;
  border-bottom:1px solid var(--border);font-size:12px;}
.lb-row:last-child{border-bottom:none;}
.lb-rank{font-size:10px;color:var(--text3);width:16px;flex-shrink:0;text-align:right;}
.lb-name{flex:1;font-weight:600;}
.lb-name.former{color:var(--text3)!important;}
.lb-val{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;}
.lb-val.gold{color:var(--gold);}
.lb-val.teal{color:var(--teal);}
.lb-val.mag{color:var(--mag);}

/* Weekly records */
.weekly-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.weekly-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--rl);padding:16px;}
.weekly-title{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px;}
.weekly-title.hi{color:var(--teal);}
.weekly-title.lo{color:var(--teal);}
.weekly-row{display:flex;align-items:center;gap:6px;padding:4px 0;
  border-bottom:1px solid var(--border);font-size:12px;}
.weekly-row:last-child{border-bottom:none;}
.weekly-year{font-size:10px;color:var(--text3);width:34px;flex-shrink:0;}
.weekly-wk{font-size:10px;color:var(--text3);width:26px;flex-shrink:0;}
.weekly-team{flex:1;font-weight:600;}
.weekly-pts{font-weight:700;font-variant-numeric:tabular-nums;}
.weekly-pts.hi{color:var(--teal);}
.weekly-pts.lo{color:var(--teal);}

@media(max-width:600px){
  .weekly-grid{grid-template-columns:1fr;}
  .lb-grid{grid-template-columns:1fr 1fr;}
  .section-label{font-size:22px;}
  .champ-card{min-width:60px;padding:7px 10px;}
}
</style>
</head>

// ── Compute all-time stats ────────────────────────────────────────────────
const allManagers = new Set();
SEASONS.forEach(s=>s.data.forEach(d=>allManagers.add(d.o)));

const stats = {};
allManagers.forEach(o=>{
  stats[o]={seasons:0,wins:0,games:0,pts:0,playoffs:0,regChamps:0,top4:0,top2:0,champs:0,bestPtsSeason:0};
});

SEASONS.forEach(s=>{
  const games = s.teams === 14 ? 14 : 13;
  s.data.forEach(d=>{
    const st = stats[d.o];
    st.seasons++;
    st.games += games;
    st.wins += (d.w||0);
    st.pts += (d.pts||0);
    if(d.rs && d.rs <= Math.ceil(s.teams/2)) st.playoffs++;
    if(d.rs===1) st.regChamps++;
    if(d.po) st.top4++;
    if(d.po && d.po<=2) st.top2++;
    if(d.pts > st.bestPtsSeason) st.bestPtsSeason = d.pts;
  });
  // champion = playoff finish 1
  const champ = s.data.find(d=>d.po===1);
  if(champ) stats[champ.o].champs++;
});

// ── Championship Wall ─────────────────────────────────────────────────────
let activeCard = null;

function getChamp(season){
  const entry = season.data.find(d=>d.po===1);
  return entry ? entry.o : null;
}

const champGrid = document.getElementById('champ-grid');
const detailContainer = document.getElementById('season-detail-container');

[...SEASONS].sort((a,b)=>b.year-a.year).forEach(season=>{
  const champ = getChamp(season);
  const color = champ ? (TEAM_COLORS[champ]||'#94a3b8') : '#94a3b8';
  const card = document.createElement('div');
  card.className = 'champ-card';
  card.dataset.year = season.year;
  card.innerHTML = `
    <div class="champ-year">${season.year}</div>
    <div class="champ-trophy">🏆</div>
    <div class="champ-name" style="color:${color}">${champ||'?'}</div>
  `;
  card.addEventListener('click', ()=>{
    if(activeCard===season.year){
      // close
      activeCard=null;
      detailContainer.innerHTML='';
      card.classList.remove('active-card');
      document.querySelectorAll('.champ-card').forEach(c=>c.classList.remove('active-card'));
    } else {
      activeCard=season.year;
      document.querySelectorAll('.champ-card').forEach(c=>c.classList.remove('active-card'));
      card.classList.add('active-card');
      renderSeasonDetail(season);
    }
  });
  champGrid.appendChild(card);
});

function renderSeasonDetail(season){
  const champ = getChamp(season);
  const champColor = champ ? (TEAM_COLORS[champ]||'#94a3b8') : '#94a3b8';
  const sorted = [...season.data].sort((a,b)=>a.rs-b.rs);
  const weekData = WEEKLY.find(w=>w.year===season.year);

  const totalGames = season.year >= 2021 ? 14 : 13;

  let rows = sorted.map(d=>{
    const poClass = d.po===1 ? 'po-1' : 'po-2';
    const poLabel = d.po===1?'🏆 Champion':d.po===2?'Runner-up':d.po===3?'3rd place':d.po===4?'4th place':'';
    const color = TEAM_COLORS[d.o]||'#94a3b8';
    const losses = d.w != null ? (totalGames - d.w) : '-';
    const poBadge = d.po ? `<span class="po-badge ${poClass}">${poLabel}</span>` : '';
    return `<tr>
      <td><span class="pos-badge">${d.rs}</span></td>
      <td style="color:${color};font-weight:700">${d.o}${poBadge}</td>
      <td style="color:var(--text2);font-variant-numeric:tabular-nums">${d.w}</td>
      <td style="color:var(--text2);font-variant-numeric:tabular-nums">${losses}</td>
      <td style="color:var(--text2);font-variant-numeric:tabular-nums">${d.pts?d.pts.toFixed(2):'-'}</td>
    </tr>`;
  }).join('');

  const weekHtml = weekData ? `
    <div style="display:flex;gap:16px;margin-top:12px;font-size:11px;color:var(--text3)">
      <span>📈 High: <strong style="color:var(--teal)">${weekData.hiPts.toFixed(2)}</strong> ${weekData.hiTeam} (Wk${weekData.hiWeek})</span>
      <span>📉 Low: <strong style="color:var(--teal)">${weekData.loPts.toFixed(2)}</strong> ${weekData.loTeam} (Wk${weekData.loWeek})</span>
    </div>` : '';

  detailContainer.innerHTML = `
    <div class="season-detail">
      <div class="season-detail-header">
        <div class="season-detail-year">${season.year}</div>
        <div class="season-detail-champ">
          <span>🏆</span>
          <span style="color:${champColor};font-weight:800">${champ}</span>
          <span style="color:var(--text3);font-weight:400;font-size:11px;margin-left:4px">${season.teams}-team · ${totalGames} games</span>
        </div>
        <button class="season-close" onclick="document.getElementById('season-detail-container').innerHTML='';document.querySelectorAll('.champ-card').forEach(c=>c.classList.remove('active-card'));window.activeCard=null">✕ Close</button>
      </div>
      <table class="season-table">
        <thead><tr>
          <th>Pos</th><th>Manager</th><th>W</th><th>L</th><th>Pts For</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
      ${weekHtml}
    </div>
  `;
  detailContainer.scrollIntoView({behavior:'smooth',block:'nearest'});
}

// ── Leaderboards ──────────────────────────────────────────────────────────
const lbGrid = document.getElementById('lb-grid');

function makeLeaderboard(title, entries, valFn, valClass='teal', minSeasons=1){
  const ranked = [...allManagers]
    .map(o=>({o, st:stats[o]}))
    .filter(({st})=>st.seasons>=minSeasons)
    .sort((a,b)=>valFn(b.st)-valFn(a.st))
    .slice(0,10);

  const card = document.createElement('div');
  card.className = 'lb-card';
  card.innerHTML = `<div class="lb-title">${title}</div>`;
  ranked.forEach(({o,st},i)=>{
    const active = ACTIVE.has(o);
    const color = active ? (TEAM_COLORS[o]||'#94a3b8') : null;
    const row = document.createElement('div');
    row.className = 'lb-row';
    row.innerHTML = `
      <span class="lb-rank">${i+1}</span>
      <span class="lb-name${active?'':' former'}" style="${color?`color:${color}`:''}">
        ${o}${active?'':'<span style="font-size:9px;margin-left:4px;color:var(--text3)">✕</span>'}
      </span>
      <span class="lb-val ${valClass}">${valFn(st,true)}</span>
    `;
    card.appendChild(row);
  });
  lbGrid.appendChild(card);
}

// Championships
makeLeaderboard('🏆 Championships',

// Win %
makeLeaderboard('Win % (3+ seasons)',
  null,
  (st,fmt)=>{
    const pct = st.wins/st.games;
    return fmt ? (pct*100).toFixed(1)+'%' : pct;
  }, 'teal', 3);

// Points per season
makeLeaderboard('Avg Pts/Season (3+ yrs)',
  null,
  (st,fmt)=>{
    const ppy = st.pts/st.seasons;
    return fmt ? Number(ppy.toFixed(0)).toLocaleString() : ppy;
  }, 'teal', 3);

// Most points in one season
makeLeaderboard('Best Single Season',
  null,
  (st,fmt)=>fmt ? Math.round(st.bestPtsSeason).toLocaleString() : st.bestPtsSeason,
  'teal');

// Playoff appearances
makeLeaderboard('Playoff Appearances',
  null,
  (st,fmt)=>{
    if(!fmt) return st.playoffs;
    return `${st.playoffs} <span style="color:var(--text3);font-weight:400">(${(st.playoffs/st.seasons*100).toFixed(0)}%)</span>`;
  }, 'teal');

// Regular season titles
makeLeaderboard('Reg. Season Titles',
  null,
  (st,fmt)=>fmt?(st.regChamps||'-'):st.regChamps,
  'teal');

// Finals appearances
makeLeaderboard('Finals Appearances (top 2)',
  null,
  (st,fmt)=>fmt?(st.top2||'-'):st.top2,
  'teal');

// Most seasons
makeLeaderboard('Most Seasons',
  null,
  (st,fmt)=>fmt?st.seasons:st.seasons,
  'teal');
